name: Release

# Two ways to publish a GitHub release:
#  1. Push a tag like v0.5.4.
#  2. Run this workflow by hand (Actions → Release → Run workflow):
#     the tag is taken from "version" in manifest.json.
# Notes come from docs/releases/<tag>.md if that file exists,
# otherwise GitHub generates them from the commit list.
# Re-running for an existing release refreshes its notes from that file.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(jq -r .version manifest.json)"
          fi
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
              echo "Release $TAG already exists, notes updated."
            else
              echo "Release $TAG already exists, nothing to do."
            fi
            exit 0
          fi
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Player ${TAG#v}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Player ${TAG#v}" --generate-notes --latest
          fi
